<style>
.camera-panel{margin:24px 0;border:1px solid #355568;border-radius:14px;overflow:hidden;background:#111f2b}.camera-head{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;background:#192d3a}.camera-head h2{margin:0;font-size:20px}.camera-actions{display:flex;gap:8px;flex-wrap:wrap}.camera-actions button{background:#264456;border:1px solid #517287;color:#e7f3fa;border-radius:7px;padding:9px 13px}.camera-actions .selected{background:#296852;border-color:#70d6af}
.camera-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;align-items:start}.camera-screen{grid-column:1;grid-row:1 / span 2;background:#050b10;aspect-ratio:16/9;position:relative;min-width:0}.camera-screen img{display:block;width:100%;height:100%;object-fit:contain}.camera-screen img[hidden]{display:none}.camera-result{grid-column:2;grid-row:1;min-width:0;padding:12px;border-left:1px solid #2a4354}.camera-result canvas{width:100%;height:auto;display:block;border:1px solid #355568;box-sizing:border-box}.camera-result canvas[hidden]{display:none}.camera-result div{font-size:12px;color:#abc3d1;margin-top:6px;line-height:1.5}.camera-result-label{margin:0 0 7px!important;color:#d4e6ed!important}.camera-media{cursor:pointer}.camera-media:focus-visible{outline:3px solid #7fe0bf;outline-offset:-3px}.camera-caption{position:absolute;bottom:10px;left:10px;max-width:calc(100% - 20px);padding:6px 9px;background:#07131de8;border-radius:6px;color:#d4e6ed;font-size:12px;pointer-events:none}
.camera-info{grid-column:2;grid-row:2;padding:16px 20px;border-left:1px solid #2a4354;min-width:0}.camera-info strong{display:block;font-size:23px;color:#7fe0bf;margin-bottom:12px}.camera-info dl{margin:18px 0;font-size:13px}.camera-info dt{color:#94b1c2;margin-top:13px}.camera-info dd{margin:4px 0 0;font-size:16px;font-variant-numeric:tabular-nums}.camera-people{list-style:none;margin:0;padding:0}.camera-people li{padding:10px 0;border-top:1px solid #2a4354;font-size:14px}.camera-foot{padding:11px 18px;border-top:1px solid #2a4354;color:#9eb5c3;font-size:12px}.camera-error{color:#ffb5a5}.camera-head a{color:#a0dfef;font-size:13px}.photo-history{margin-top:22px}.photo-history summary{cursor:pointer;padding:16px;background:#192c39;border-radius:8px;margin-bottom:16px}
.camera-panel.detection-large .camera-result{grid-column:1;grid-row:1 / span 2;border-left:0;padding:14px}.camera-panel.detection-large .camera-screen{grid-column:2;grid-row:1;border-left:1px solid #2a4354}.camera-panel.detection-large .camera-info{grid-column:2;grid-row:2}
@media(max-width:850px){.camera-grid{grid-template-columns:minmax(0,1fr) 34%}.camera-screen,.camera-result,.camera-panel.detection-large .camera-result,.camera-panel.detection-large .camera-screen{grid-row:1}.camera-info,.camera-panel.detection-large .camera-info{grid-column:1 / -1;grid-row:2;border-left:0;border-top:1px solid #2a4354;padding:16px}.camera-info dl{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}.camera-info strong{font-size:21px}.camera-head{align-items:flex-start;flex-direction:column}.camera-caption{font-size:10px;bottom:5px;left:5px;padding:4px;max-width:calc(100% - 10px)}.camera-result{padding:7px}.camera-result div{font-size:10px}}
.camera-pad{padding:12px;border:1px solid #517287;border-radius:8px;background:#192d3a;color:#b5efdc;font-size:15px;line-height:1.6;margin:14px 0}.camera-pad.camera-error{color:#ffb5a5;border-color:#9a6265}
</style>
<section class="camera-panel" id="cameraPanel" data-main-view="preview" aria-label="摄像头画面和检测信息">
 <div class="camera-head"><div><h2>摄像头画面与检测</h2><a href="#galleryPanel">登记人员</a></div><div class="camera-actions"><button id="camAuto" class="selected" type="button">暂停自动检测</button><button id="camOnce" type="button">检测一次</button><button id="camPreview" type="button">只看实时画面</button></div></div>
 <div class="camera-grid">
  <div class="camera-screen camera-media" id="camPreviewTile" role="button" tabindex="0" aria-label="放大实时预览" aria-pressed="true"><img id="camVideo" alt="实时摄像头视频" hidden><div class="camera-caption" id="camCaption">正在连接摄像头…</div></div>
  <div class="camera-result camera-media" id="camDetectionTile" role="button" tabindex="0" aria-label="放大检测图" aria-pressed="false"><div class="camera-result-label" id="camDetectionLabel">检测图 · 点击可放大</div><canvas id="camCanvas" width="960" height="540" aria-label="最近一次检测帧，检测框与五点只属于此帧" hidden></canvas><div id="camResultCaption">尚无检测结果</div></div>
  <aside class="camera-info"><strong id="camState" role="status">等待检测</strong><div id="camMessage" class="muted">视频持续播放，检测结果单独更新。</div><p class="camera-pad" id="camPad" role="status">活体防伪：等待检测</p><dl><div><dt>预览源帧率</dt><dd id="camPreviewFps">统计中</dd></div><div><dt>检测更新率</dt><dd id="camDetectFps">统计中</dd></div><div><dt>最近人脸数量</dt><dd id="camCount">—</dd></div><div><dt>检测耗时</dt><dd id="camTime">—</dd></div><div><dt>检测帧号</dt><dd id="camFrame">—</dd></div></dl><ul class="camera-people" id="camPeople"></ul></aside>
 </div>
 <div class="camera-foot"><details class="help"><summary>说明</summary><div class="help-content"><p>点击画面可放大。实时画面持续播放，检测结果单独更新。</p><p>姓名与防伪结果只对应检测图，每次最多处理 4 张人脸。姓名匹配不代表活体通过；请结合结果时间判断，当前模型尚未校准。</p></div></details></div>
</section>
